<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <title>MATHERA — madalyon logo (koyu)</title>

  <defs>
    <!-- ============ WORDMARK LETTERFORMS ============
         Geometrik, tek genişlikli kontur. A harfinin ortasında
         ekran alıntısındaki gibi dolu üçgen çentik var.
         Yerel koordinat sistemi: cap height 0..100, toplam genişlik 782. -->
    <g id="wm">
      <path transform="translate(0,0)"   d="M0,0 H16 L48,52 L80,0 H96 V100 H82 V26 L55,70 H41 L14,26 V100 H0 Z"/>
      <path transform="translate(122,0)" d="M0,100 H18 L48,26 L78,100 H96 L57,0 H39 Z"/>
      <path transform="translate(122,0)" d="M48,48 L67.5,74 H28.5 Z"/>
      <path transform="translate(244,0)" d="M0,0 H84 V14 H49 V100 H35 V14 H0 Z"/>
      <path transform="translate(354,0)" d="M0,0 H14 V43 H74 V0 H88 V100 H74 V57 H14 V100 H0 Z"/>
      <path transform="translate(468,0)" d="M0,0 H80 V14 H14 V43 H70 V57 H14 V86 H80 V100 H0 Z"/>
      <path transform="translate(574,0)" fill-rule="evenodd" d="M0,0 H72 V52 H52 L86,100 H66 L32,52 H14 V100 H0 Z M14,14 H58 V38 H14 Z"/>
      <path transform="translate(686,0)" d="M0,100 H18 L48,26 L78,100 H96 L57,0 H39 Z"/>
      <path transform="translate(686,0)" d="M48,48 L67.5,74 H28.5 Z"/>
    </g>

    <!-- ============ ENGRAVED GLYPHS (π 2 3 0 5) ============
         Konturlu (stroke) çizim: kazıma/gravür hissi.
         Yerel kutu: 60 x 80 -->
    <g id="g-pi" fill="none" stroke-linecap="round">
      <path d="M6,26 H54"/>
      <path d="M21,26 V64 q0,9 -9,9"/>
      <path d="M43,26 V73"/>
    </g>
    <g id="g-2" fill="none" stroke-linecap="round">
      <path d="M8,25 a22,20 0 1 1 44,4 c0,15 -23,25 -44,45 h46"/>
    </g>
    <g id="g-3" fill="none" stroke-linecap="round">
      <path d="M9,22 a21,17 0 1 1 34,17 q-6,4 -12,4 q6,0 12,4 a21,17 0 1 1 -34,17"/>
    </g>
    <g id="g-0" fill="none">
      <ellipse cx="30" cy="40" rx="23" ry="37"/>
    </g>
    <g id="g-5" fill="none" stroke-linecap="round">
      <path d="M50,7 H16 V36 H31 a20,20 0 1 1 -19,26"/>
    </g>

    <!-- ============ GRADIENTS ============ -->

    <!-- Bakır / rose-gold: parlak tepe, koyu orta bant, ikinci parlaklık, koyu taban -->
    <linearGradient id="copper" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="100">
      <stop offset="0.00" stop-color="#d9a179"/>
      <stop offset="0.12" stop-color="#c08a63"/>
      <stop offset="0.30" stop-color="#9c5f40"/>
      <stop offset="0.44" stop-color="#86482f"/>
      <stop offset="0.53" stop-color="#a56d49"/>
      <stop offset="0.67" stop-color="#c48d66"/>
      <stop offset="0.83" stop-color="#9d6544"/>
      <stop offset="1.00" stop-color="#6d3c26"/>
    </linearGradient>

    <!-- Fırçalanmış gümüş halka -->
    <linearGradient id="silver" gradientUnits="userSpaceOnUse" x1="185" y1="150" x2="830" y2="865">
      <stop offset="0.00" stop-color="#dadddf"/>
      <stop offset="0.16" stop-color="#a9aeb0"/>
      <stop offset="0.32" stop-color="#8a8f92"/>
      <stop offset="0.46" stop-color="#cdd0d1"/>
      <stop offset="0.60" stop-color="#9ba0a3"/>
      <stop offset="0.76" stop-color="#7d8285"/>
      <stop offset="0.90" stop-color="#b6babc"/>
      <stop offset="1.00" stop-color="#888d90"/>
    </linearGradient>

    <!-- Gümüş halkanın üzerindeki ışık vurgusu -->
    <radialGradient id="ringSheen" gradientUnits="userSpaceOnUse" cx="330" cy="270" r="620">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Altın iç halka -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="230" y1="200" x2="790" y2="820">
      <stop offset="0.00" stop-color="#f2dda6"/>
      <stop offset="0.22" stop-color="#cfa860"/>
      <stop offset="0.40" stop-color="#a8823f"/>
      <stop offset="0.55" stop-color="#e8cd8e"/>
      <stop offset="0.72" stop-color="#b28c46"/>
      <stop offset="0.88" stop-color="#dcc07c"/>
      <stop offset="1.00" stop-color="#96733a"/>
    </linearGradient>

    <!-- Krem yüzey -->
    <radialGradient id="face" gradientUnits="userSpaceOnUse" cx="420" cy="360" r="480">
      <stop offset="0" stop-color="#23374f"/>
      <stop offset="0.62" stop-color="#182a3f"/>
      <stop offset="1" stop-color="#0e1c2c"/>
    </radialGradient>

    <!-- ============ FILTERS ============ -->

    <!-- Harflerin kabartma (emboss) etkisi -->
    <filter id="bevel" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="blr"/>
      <feSpecularLighting in="blr" surfaceScale="3" specularConstant="0.55"
                          specularExponent="22" lighting-color="#ffeedc" result="spec">
        <feDistantLight azimuth="225" elevation="60"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClip"/>
      <feComposite in="SourceGraphic" in2="specClip" operator="arithmetic"
                   k1="0" k2="1" k3="1" k4="0"/>
    </filter>

    <!-- Madalyonun zemine düşen gölgesi -->
    <filter id="dropOuter" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Harflerin yüzeye düşen ince gölgesi -->
    <filter id="dropText" x="-25%" y="-60%" width="150%" height="220%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#050d16" flood-opacity="0.70"/>
    </filter>
  </defs>

  <!-- ============ ZEMİN ============ -->
  <rect width="1000" height="1000" fill="#0b1522"/>

  <!-- ============ MADALYON ============ -->
  <g filter="url(#dropOuter)">
    <circle cx="500" cy="500" r="380" fill="url(#silver)"/>
  </g>

  <!-- halka üzerindeki ışık + kenar tanımları -->
  <circle cx="500" cy="500" r="380" fill="url(#ringSheen)"/>
  <circle cx="500" cy="500" r="379" fill="none" stroke="#6f7477" stroke-opacity="0.55" stroke-width="2"/>
  <circle cx="500" cy="500" r="373" fill="none" stroke="#eef0f1" stroke-opacity="0.45" stroke-width="3"/>
  <circle cx="500" cy="500" r="340" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="26"/>

  <!-- gravür glifler: 45° aralıkla 8 pozisyon -->
  <g stroke="#6b7073" stroke-opacity="0.85" stroke-width="6" >
    <!-- açık gri kabartma kopyası (kazıma yanılsaması) -->
    <g stroke="#f0f2f3" stroke-opacity="0.5" transform="translate(0,-2)">
      <use href="#g-0"  transform="translate(825.5,478) scale(0.55)"/>
      <use href="#g-3"  transform="translate(725.4,236.1) scale(0.55)"/>
      <use href="#g-pi" transform="translate(483.5,136) scale(0.55)"/>
      <use href="#g-2"  transform="translate(241.6,236.1) scale(0.55)"/>
      <use href="#g-0"  transform="translate(141.5,478) scale(0.55)"/>
      <use href="#g-5"  transform="translate(241.6,719.9) scale(0.55)"/>
      <use href="#g-pi" transform="translate(483.5,820) scale(0.55)"/>
      <use href="#g-5"  transform="translate(725.4,719.9) scale(0.55)"/>
    </g>
    <use href="#g-0"  transform="translate(825.5,478) scale(0.55)"/>
    <use href="#g-3"  transform="translate(725.4,236.1) scale(0.55)"/>
    <use href="#g-pi" transform="translate(483.5,136) scale(0.55)"/>
    <use href="#g-2"  transform="translate(241.6,236.1) scale(0.55)"/>
    <use href="#g-0"  transform="translate(141.5,478) scale(0.55)"/>
    <use href="#g-5"  transform="translate(241.6,719.9) scale(0.55)"/>
    <use href="#g-pi" transform="translate(483.5,820) scale(0.55)"/>
    <use href="#g-5"  transform="translate(725.4,719.9) scale(0.55)"/>
  </g>

  <!-- iç krem yüzey -->
  <circle cx="500" cy="500" r="294" fill="url(#face)"/>
  <!-- yüzeyin gümüş halkaya oturduğu iç gölge -->
  <circle cx="500" cy="500" r="293" fill="none" stroke="#050c14" stroke-opacity="0.75" stroke-width="3"/>

  <!-- altın iç halka -->
  <circle cx="500" cy="500" r="281" fill="none" stroke="url(#gold)" stroke-width="9"/>
  <circle cx="500" cy="500" r="285.5" fill="none" stroke="#6d5324" stroke-opacity="0.30" stroke-width="1.6"/>
  <circle cx="500" cy="500" r="276.5" fill="none" stroke="#fdf1cf" stroke-opacity="0.40" stroke-width="1.4"/>

  <!-- ============ WORDMARK ============
       Yerel 782x100 → 520 genişliğe ölçekle (0.665), madalyonda ortala. -->
  <g transform="translate(240,466.75) scale(0.665)">
    <use href="#wm" fill="#050d16" fill-opacity="0.65" filter="url(#dropText)"/>
    <use href="#wm" fill="url(#copper)" stroke="#5e3421" stroke-width="1" filter="url(#bevel)"/>
  </g>
</svg>
